  <rect width="480" height="270" fill="url(#base)"/>
  <ellipse cx="80" cy="20" rx="250" ry="210" fill="url(#glowA)"/>
  <ellipse cx="430" cy="245" rx="220" ry="200" fill="url(#glowB)"/>
  <ellipse cx="360" cy="40" rx="190" ry="170" fill="url(#glowC)"/>
  <rect width="480" height="270" fill="url(#grille)" mask="url(#gridMask)"/>
