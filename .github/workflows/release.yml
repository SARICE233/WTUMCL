# Manually build and release artifacts instead of using tauri-actions
# Reasons:
# 1. Include OS name in output filenames (tauri-actions doesn't support this)
# 2. Publish portable .exe for Windows (unsupported by tauri-actions either)
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Version-Check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Check version consistency
        run: pnpm run version check

      - name: Check Tag Version
        id: check-tag
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $PKG_VERSION"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION="${{ github.ref_name }}"
            TAG_VERSION=${TAG_VERSION#v}
            
            if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
              echo "❌ Git tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)"
              exit 1
            fi
            echo "✅ Git tag version matches package version: $TAG_VERSION"
          else
            COMMIT_HASH=$(git rev-parse HEAD)
            COMMIT_HASH=${COMMIT_HASH:0:6}
            PKG_VERSION="$PKG_VERSION"-"$COMMIT_HASH"
            echo "Not a tag, using package version with commit hash: $PKG_VERSION"
          fi

          # Set the version as output
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

  Build-and-Release:
    needs: [Version-Check]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.Version-Check.outputs.version }}
      branch: ${{ github.ref }}
      upload_artifacts: true
    secrets:
      WTUMCL_CURSEFORGE_API_KEY: ${{ secrets.WTUMCL_CURSEFORGE_API_KEY }}

  Create-Release:
    needs: [Version-Check, Build-and-Release]
    if: always() && needs.Build-and-Release.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download non-macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "WTUMCL_${{ needs.Version-Check.outputs.version }}_*"
          path: artifacts
          merge-multiple: true

      - name: Organize release artifacts
        env:
          VERSION: ${{ needs.Version-Check.outputs.version }}
        run: |
          mkdir -p release-artifacts
          find artifacts -name "WTUMCL_${VERSION}_*" -exec cp {} release-artifacts/ \;

          # The per-job .sha256 files hash the raw compiled binaries, not the files
          # users actually download (setup.exe / portable / .deb / .rpm / .app.tar.gz),
          # so they must never be published as the release manifest. SHA256SUMS.txt is
          # rebuilt from release-artifacts/ in the "Create Release" step instead.
          rm -f release-artifacts/*.sha256

          echo "Final release artifacts:"
          ls -la release-artifacts/

      - name: Generate Changelog
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install requests packaging
          python scripts/release/generate_changelog_draft.py > release-notes.md

          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "" >> release-notes.md
          echo "⚠️ **Note:** macOS artifacts in this release are **not code-signed**. macOS users may see security warnings when running the application." >> release-notes.md
        shell: bash

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.Version-Check.outputs.version }}
        run: |
          set -euo pipefail

          # The manifest must describe the files that are actually uploaded, so rebuild
          # it from ./release-artifacts/ rather than from per-job binary hashes.
          shopt -s nullglob
          artifact_files=(release-artifacts/*)
          shopt -u nullglob
          if [ "${#artifact_files[@]}" -eq 0 ]; then
            echo "❌ release-artifacts/ is empty; refusing to publish a release without artifacts"
            exit 1
          fi

          manifest=$(mktemp)
          {
            echo "# Version: ${VERSION}"
            echo "# Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            while IFS= read -r -d '' file; do
              printf '%s  %s\n' "$(sha256sum -- "$file" | cut -c1-64)" "$(basename "$file")"
            done < <(find release-artifacts -maxdepth 1 -type f ! -name '*.sha256' -print0 | sort -z)
          } > "$manifest"
          mv "$manifest" SHA256SUMS.txt

          # Keep the uploaded set identical to the hashed set: a stale per-job *.sha256
          # (or a leftover manifest) must never be published alongside SHA256SUMS.txt.
          rm -f release-artifacts/*.sha256

          # Fail if the manifest does not cover exactly the artifacts being uploaded.
          artifact_count=$(find release-artifacts -maxdepth 1 -type f ! -name '*.sha256' | wc -l | tr -d ' ')
          checksum_count=$(grep -cE '^[0-9a-f]{64}  ' SHA256SUMS.txt || true)
          if [ "$artifact_count" -eq 0 ] || [ "$checksum_count" -ne "$artifact_count" ]; then
            echo "❌ SHA256SUMS.txt covers ${checksum_count} of ${artifact_count} release artifacts"
            exit 1
          fi

          echo "Release artifacts and SHA256SUMS.txt:"
          cat SHA256SUMS.txt
          ( cd release-artifacts && grep -E '^[0-9a-f]{64}  ' ../SHA256SUMS.txt | sha256sum -c - )

          # A release may already exist for this tag (prepared manually with curated notes).
          # In that case upload the freshly built artifacts to it instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading artifacts to it."
            gh release upload "$GITHUB_REF_NAME" ./release-artifacts/* SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "WTUMCL ${{ env.VERSION }}" \
              --draft \
              --notes-file release-notes.md \
              ./release-artifacts/* SHA256SUMS.txt
          fi
