[advisories]
ignore = [
  # RSA is used for local signing and JWT verification; no decryption. No upstream fix is available yet.
  "RUSTSEC-2023-0071",
]

# Local runs from the repo root use the cached advisory database (~/.cargo/advisory-db)
# instead of fetching from GitHub, so `cargo audit --file src-tauri/Cargo.lock` is
# deterministic offline. Scanning is unaffected: the same config still reports the three
# zip advisories against a zip 2.x lockfile (see .owv/zip9-migration.md). The CI job and
# src-tauri/.cargo/audit.toml keep fetching, so the database stays current.
[database]
fetch = false
stale = true
